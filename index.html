<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talas_profi — Заказ услуг в Таласе</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Иконки -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-400 selection:text-black">

  <!-- ================= БЛОК 1: ШАПКА (HEADER) ================= -->
  <header class="sticky top-0 z-50 bg-black/95 backdrop-blur border-b border-zinc-800 px-3 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      
      <!-- Логотип и Бренд -->
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 bg-amber-400 rounded-lg flex items-center justify-center font-black text-black text-lg shadow-md shadow-amber-400/20 tracking-tighter">
          TP
        </div>
        <div>
          <h1 class="text-base font-black tracking-wide text-white uppercase leading-none">
            Talas<span class="text-amber-400">_profi</span>
          </h1>
          <p class="text-[10px] text-zinc-400 font-medium tracking-wider uppercase mt-0.5 flex items-center gap-1" id="header-subtitle">
            <i class="fa-solid fa-location-dot text-amber-400 text-[9px]"></i> Талас и область
          </p>
        </div>
      </div>

      <!-- Правый блок: Переключатель языка + Быстрый звонок -->
      <div class="flex items-center gap-2">
        
        <!-- Переключатель языка KG / RU -->
        <button id="lang-toggle" onclick="toggleLanguage()" class="bg-zinc-900 border border-zinc-700 hover:border-amber-400 text-amber-400 font-bold text-xs px-2.5 py-2 rounded-lg flex items-center gap-1 active:scale-95 transition-all">
          <i class="fa-solid fa-globe text-zinc-400 text-[11px]"></i>
          <span id="lang-label">KG</span>
        </button>

        <!-- Кнопка Звонка -->
        <a href="tel:+996755000228" class="bg-amber-400 hover:bg-amber-500 text-black font-bold text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-md shadow-amber-400/20 active:scale-95 transition-all">
          <i class="fa-solid fa-phone text-xs"></i>
          <span id="call-btn-text">Чалуу</span>
        </a>

      </div>

    </div>
  </header>

  <!-- Простой скрипт переключения языка для теста -->
  <script>
    let currentLang = 'ru'; // По умолчанию русский
    
    function toggleLanguage() {
      if (currentLang === 'ru') {
        currentLang = 'kg';
        document.getElementById('lang-label').innerText = 'RU';
        document.getElementById('header-subtitle').innerHTML = '<i class="fa-solid fa-location-dot text-amber-400 text-[9px]"></i> Талас жана облус';
        document.getElementById('call-btn-text').innerText = 'Чалуу';
      } else {
        currentLang = 'ru';
        document.getElementById('lang-label').innerText = 'KG';
        document.getElementById('header-subtitle').innerHTML = '<i class="fa-solid fa-location-dot text-amber-400 text-[9px]"></i> Талас и область';
        document.getElementById('call-btn-text').innerText = 'Позвонить';
      }
    }
  </script>
  <!-- ================= КОНЕЦ БЛОКА 1 ================= -->

























    

</body>
</html>
