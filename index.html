<!DOCTYPE html>
<html lang="kg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talas_profi</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Иконки -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-400 selection:text-black">

  <!-- ================= БЛОК 1: ШАПКА С ПЕРЕКЛЮЧАТЕЛЕМ ЯЗЫКА ================= -->
  <header class="sticky top-0 z-50 bg-black/95 backdrop-blur border-b border-zinc-800 px-3 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      
      <!-- Логотип и Название бренда -->
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 bg-amber-400 rounded-lg flex items-center justify-center font-black text-black text-lg shadow-md shadow-amber-400/20 tracking-tighter">
          TP
        </div>
        <div>
          <h1 class="text-base font-black tracking-wide text-white uppercase leading-none">
            Talas<span class="text-amber-400">_profi</span>
          </h1>
          <p class="text-[10px] text-zinc-400 font-medium tracking-wider uppercase mt-0.5 flex items-center gap-1">
            <i class="fa-solid fa-location-dot text-amber-400 text-[9px]"></i> 
            <span id="txt-subtitle">Талас жана облус</span>
          </p>
        </div>
      </div>

      <!-- Переключатель языка + Кнопка звонка -->
      <div class="flex items-center gap-2">
        
        <!-- Кнопка переключения языка -->
        <button id="lang-toggle" onclick="toggleLanguage()" class="bg-zinc-900 border border-zinc-700 hover:border-amber-400 text-amber-400 font-bold text-xs px-2.5 py-2 rounded-lg flex items-center gap-1 active:scale-95 transition-all">
          <i class="fa-solid fa-globe text-zinc-400 text-[11px]"></i>
          <span id="lang-label">RU</span>
        </button>

        <!-- Кнопка Звонка -->
        <a href="tel:+996755000228" class="bg-amber-400 hover:bg-amber-500 text-black font-bold text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-md shadow-amber-400/20 active:scale-95 transition-all">
          <i class="fa-solid fa-phone text-xs"></i>
          <span id="txt-callBtnHeader">Чалуу</span>
        </a>

      </div>

    </div>
  </header>
  <!-- ================= КОНЕЦ БЛОКА 1 ================= -->

  
  
  
  
  
  
  
  <!-- ================= БЛОК 1: ГЛАВНЫЙ ЭКРАН (HERO SECTION) ================= -->
<section class="px-4 pt-6 pb-8 border-b border-zinc-800">
  <div class="max-w-md mx-auto">

    <!-- Эксклюзивная крупная плашка -->
    <div class="text-center mb-4">
      <span class="inline-flex items-center gap-2 bg-amber-400/10 border border-amber-400/40 text-amber-400 px-3.5 py-1.5 rounded-full text-xs font-black uppercase tracking-wide">
        <i class="fa-solid fa-star text-amber-400"></i>
        <span id="txt-badge">Таласта биринчи ушундай сервис!</span>
      </span>
    </div>

    <!-- Главный заголовок (крупный и понятный) -->
    <h2 class="text-3xl font-black uppercase tracking-tight text-white text-center leading-tight mb-3" id="txt-titleHtml">
      Бардык кызматтар <br>
      <span class="text-amber-400">Таласта</span> бир жерде
    </h2>

    <!-- Простой и понятный подзаголовок -->
    <p class="text-zinc-300 text-sm font-medium text-center leading-relaxed mb-6 px-2" id="txt-desc">
      Электрика, сантехника, ремонт, тазалоо жана башка бардык жумуштар. Усталар чалууга даяр!
    </p>

    <!-- Большие удобные кнопки вызова под палец -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      
      <!-- WhatsApp (крупный) -->
      <a href="https://wa.me/996755000228?text=%D0%A1%D0%B0%D0%BB%D0%B0%D0%BC%D0%B0%D1%82%D1%81%D1%8B%D0%B7%D0%B1%D0%B0!%20%D0%9C%D0%B5%D0%BD%20%D0%BA%D1%8B%D0%B7%D0%BC%D0%B0%D1%82%20%D0%B1%D1%83%D1%8E%D1%80%D1%82%D0%BC%D0%B0%20%D0%B1%D0%B5%D1%80%D0%B5%D0%B9%D0%BD%20%D0%B4%D0%B5%D0%B3%D0%B5%D0%BD%D0%B5%D0%BC." 
         target="_blank" 
         rel="noopener noreferrer"
         class="bg-[#25D366] hover:bg-[#20bd5a] text-white font-black text-base py-4 px-3 rounded-2xl flex flex-col items-center justify-center gap-1 shadow-xl shadow-[#25D366]/20 active:scale-95 transition-all text-center">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
        <span id="txt-btnWa">WhatsApp</span>
      </a>

      <!-- Чалуу / Звонок (крупный) -->
      <a href="tel:+996755000228" 
         class="bg-amber-400 hover:bg-amber-500 text-black font-black text-base py-4 px-3 rounded-2xl flex flex-col items-center justify-center gap-1 shadow-xl shadow-amber-400/20 active:scale-95 transition-all text-center">
        <i class="fa-solid fa-phone text-2xl"></i>
        <span id="txt-btnCall">Чалуу</span>
      </a>

    </div>

    <!-- 3 простые фишки внизу -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
        <span class="text-amber-400 font-black text-sm block mb-0.5" id="txt-feat1Val">Тез</span>
        <span class="text-xs font-bold text-zinc-300" id="txt-feat1Key">Келүү</span>
      </div>
      <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
        <span class="text-amber-400 font-black text-sm block mb-0.5" id="txt-feat2Val">100%</span>
        <span class="text-xs font-bold text-zinc-300" id="txt-feat2Key">Сапат</span>
      </div>
      <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
        <span class="text-amber-400 font-black text-sm block mb-0.5" id="txt-feat3Val">Ыңгайлуу</span>
        <span class="text-xs font-bold text-zinc-300" id="txt-feat3Key">Баалар</span>
      </div>
    </div>

  </div>
  <script>
  // =========================================================
  // 📝 СЛОВАРЬ ПЕРЕВОДОВ (KG / RU)
  // =========================================================
  const translations = {
    kg: {
      // Шапка
      subtitle: "Талас жана облус",
      callBtnHeader: "Чалуу",
      
      // Блок 1 (Главный экран)
      badge: "Таласта биринчи ушундай сервис!",
      titleHtml: 'Бардык кызматтар <br><span class="text-amber-400">Таласта</span> бир жерде',
      desc: "Электрика, сантехника, ремонт, тазалоо жана башка бардык жумуштар. Усталар чалууга даяр!",
      btnWa: "WhatsApp",
      btnCall: "Чалуу",
      feat1Val: "Тез",
      feat1Key: "Келүү",
      feat2Val: "100%",
      feat2Key: "Сапат",
      feat3Val: "Ыңгайлуу",
      feat3Key: "Баалар"
    },
    ru: {
      // Шапка
      subtitle: "Талас и область",
      callBtnHeader: "Позвонить",
      
      // Блок 1 (Главный экран)
      badge: "Первый подобный сервис в Таласе!",
      titleHtml: 'Все виды услуг <br><span class="text-amber-400">в Таласе</span> в одном месте',
      desc: "Электрика, сантехника, ремонт, уборка и любые другие задачи. Мастера готовы к вызову!",
      btnWa: "WhatsApp",
      btnCall: "Позвонить",
      feat1Val: "Быстро",
      feat1Key: "Выезд",
      feat2Val: "100%",
      feat2Key: "Качество",
      feat3Val: "Удобные",
      feat3Key: "Цены"
    }
  };

  // По умолчанию при открытии — кыргызский язык
  let currentLang = 'kg';

  function updateLanguageUI() {
    // Кнопка на шапке показывает язык, на который можно переключить
    const langLabel = document.getElementById('lang-label');
    if (langLabel) {
      langLabel.innerText = (currentLang === 'kg') ? 'RU' : 'KG';
    }

    const langData = translations[currentLang];

    // Автоматически обновляем все элементы на странице по их id (txt-ключ)
    for (let key in langData) {
      const el = document.getElementById('txt-' + key);
      if (el) {
        el.innerHTML = langData[key];
      }
    }
  }

  function toggleLanguage() {
    currentLang = (currentLang === 'kg') ? 'ru' : 'kg';
    updateLanguageUI();
  }

  // Запускаем перевод сразу при загрузке страницы
  document.addEventListener("DOMContentLoaded", updateLanguageUI);
</script>
</section>
<!-- ================= КОНЕЦ БЛОКА 1 ================= -->
  
  
  
  
  
  
  

  <!-- ================= ГЛОБАЛЬНАЯ СИСТЕМА ПЕРЕВОДА ================= -->
  <script>
    const translations = {
      kg: {
        subtitle: "Талас жана облус",
        callBtnHeader: "Чалуу"
      },
      ru: {
        subtitle: "Талас и область",
        callBtnHeader: "Позвонить"
      }
    };

    let currentLang = 'kg';

    function updateLanguageUI() {
      document.getElementById('lang-label').innerText = (currentLang === 'kg') ? 'RU' : 'KG';
      const langData = translations[currentLang];

      for (let key in langData) {
        const el = document.getElementById('txt-' + key);
        if (el) {
          el.innerHTML = langData[key];
        }
      }
    }

    function toggleLanguage() {
      currentLang = (currentLang === 'kg') ? 'ru' : 'kg';
      updateLanguageUI();
    }

    document.addEventListener("DOMContentLoaded", updateLanguageUI);
  </script>

</body>
</html>
